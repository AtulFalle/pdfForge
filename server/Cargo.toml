[package]
name = "pdfforge"
version = "0.1.0"
edition = "2021"
description = "PDFForge API and content-stream PDF engine"
license = "MIT"
repository = "https://github.com/AtulFalle/pdfForge"
homepage = "https://pdfforge-woad.vercel.app"
authors = ["Atul Falle"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
lopdf = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time", "signal"] }
utoipa = { version = "5", features = ["macros", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "reqwest"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
