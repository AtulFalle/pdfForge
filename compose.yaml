services:
  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - api-tmp:/tmp/pdfforge
    environment:
      PDFFORGE_TMP: /tmp/pdfforge
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-tmp:
